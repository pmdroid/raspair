# Vinyl Bridge Pi — copy to /etc/vinyl-bridge/config.toml (or pass --config).

device_name = "Vinyl Bridge"
http_bind = "0.0.0.0:80"
mdns_hostname = "vinyl-bridge"

# Capture device:
#   macOS (cpal/CoreAudio): "default" or substring of device name
#     (System Settings → Sound → Input; or log line at startup).
#   Linux/Pi (ALSA): see `arecord -l` — "default" or "hw:1,0".
capture_device = "default"
sample_rate = 48000
channels = 2
# Bits per sample at the ALSA device (16, 24, or 32).
# On Pi I2S + WM8782: 32 (or 24) uses S32_LE slots @ 96 kHz when ADC is master.
bits = 24
# Digital gain after capture (dB). Negative adds headroom / reduces clipping.
# Hot WM8782 boards (~+6 dB analog) often need -6…-12.
capture_gain_db = -12.0
# Live capture stream for Android / VLC (ESP capture_tap parity).
stream_port = 8088

# Recording directory (replaces microSD mount on the ESP path).
record_dir = "/var/lib/vinyl-bridge/rec"
record_min_free_bytes = 16777216  # 16 MiB

# Signal gate (dBFS) — open AirPlay when RMS exceeds start threshold.
audio_start_threshold_db = -45.0
audio_start_hold_ms = 250
audio_stop_threshold_db = -52.0
audio_stop_timeout_sec = 15

# Startup volume sent to speakers (dB attenuation; 0 = full).
volume_db = -30.0

# When true, force a session open without waiting for signal gate.
# Useful for bring-up without a turntable connected.
force_open = false

# Auto-start/stop WAV recording when the energy gate opens/closes
# (silence → music → silence). Manual /api/record/* still works.
auto_record = false

# Silence-split multi-track mode for armed sessions (per-song WAVs).
record_auto_split = false
# track_start_threshold_db = -45.0
# track_start_hold_ms = 300
# track_stop_threshold_db = -55.0
# track_stop_hold_ms = 2500

# After a recording finalizes, try Chromaprint (fpcalc) + AcoustID.
# Graceful degrade if fpcalc or key is missing. Key can also be set via
# ACOUSTID_API_KEY env, or at runtime via PUT /api/settings / web UI.
music_id_enabled = false
acoustid_api_key = ""
# FPCALC_PATH=/usr/bin/fpcalc   # optional override (env, not TOML)

# Optional fixed targets (overridden by POST /api/select from Android).
# [[targets]]
# name = "Living Room"
# ip = "192.168.1.50"
# device_id = "AA:BB:CC:DD:EE:FF"
# port = 7000
# type = "airplay"   # or "chromecast"
