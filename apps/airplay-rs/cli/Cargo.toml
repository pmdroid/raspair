[package]
name = "airplay-cli"
description = "discover and play CLI for the AirPlay 2 client"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Pascal <me@pascal.sh>"]

[[bin]]
name = "airplay"
path = "src/main.rs"

[dependencies]
airplay-core = { path = "../../../crates/airplay-core" }
anyhow = "1"
log = "0.4"
libc = "0.2"
serde_json = "1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }

[dev-dependencies]
insta = { version = "1.49.0", default-features = false }
tempfile = "3"
