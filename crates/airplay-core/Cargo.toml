[package]
publish = false
name = "airplay-core"
description = "AirPlay 2 client core: pairing, RTSP, realtime + buffered audio streams"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Pascal <me@pascal.sh>"]

[lib]
name = "airplay_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
thiserror = "1"
log = "0.4"
hex = "0.4"
sha2 = "0.10"
hkdf = "0.12"
chacha20poly1305 = "0.10"
aes = "0.8"
cbc = "0.1"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
pem = "3"
plist = "1.7"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
mdns-sd = "0.11"
dirs = "5"
socket2 = "0.5"
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "pcm", "flac", "mp3", "isomp4", "aac", "alac", "id3v2"] }
rubato = { version = "=5.0.1", default-features = false }
