name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libasound2-dev libssl-dev
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
        with:
          version: 2026.9.11
      - name: Test Rust packages
        run: |
          if [[ -f Cargo.toml ]]; then
            cargo test --locked --workspace --all-targets
          else
            cargo test --locked --manifest-path apps/pi4-host/Cargo.toml --all-targets
            cargo test --locked --manifest-path apps/airplay-rs/Cargo.toml --workspace --all-targets
          fi
      - name: Test ALSA capture
        if: runner.os == 'Linux'
        run: cargo test --locked --manifest-path apps/pi4-host/Cargo.toml --no-default-features --features alsa --all-targets

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
        with:
          version: 2026.9.11
      - name: Install web dependencies
        run: bun install --frozen-lockfile
      - name: Lint, check formatting and build
        run: bun run check
      - name: Install Chromium
        run: bunx --no-install playwright install --with-deps chromium
      - name: Test desktop and mobile workflows
        run: bun run test --forbid-only

  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb
        with:
          version: 3.99.8
          extra_args: --results=verified,unknown

  ci:
    name: CI
    if: always()
    needs: [rust, web, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful checks
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          WEB_RESULT: ${{ needs.web.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
        run: |
          test "$RUST_RESULT" = success
          test "$WEB_RESULT" = success
          test "$SECRETS_RESULT" = success
